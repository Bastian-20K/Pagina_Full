<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos y Cuotas - LimpiezaPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
    <script>
        if (localStorage.getItem('sesionActiva') !== 'true') { window.location.href = 'index.html'; }
    </script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg custom-navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="usuario.html">LimpiezaPro - Portal Usuario</a>
            <div class="ms-auto">
                <a href="usuario.html" class="btn btn-outline-light btn-sm">Volver al Panel</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="mb-4 color-verde fw-bold text-center">Gestión de Pagos</h2>
        <div class="row" id="contenedorPagos">
            <!-- Los pagos se cargarán aquí -->
        </div>
    </div>

    <script>
        function cargarPagos() {
            const usuarioActivo = localStorage.getItem('nombreUsuarioActivo');
            const todasLasSolicitudes = JSON.parse(localStorage.getItem('solicitudesLimpieza')) || [];
            const contenedor = document.getElementById('contenedorPagos');
            contenedor.innerHTML = ''; // Limpiar contenedor

            const misSolicitudes = todasLasSolicitudes.filter(sol => sol.usuario === usuarioActivo);

            if (misSolicitudes.length === 0) {
                contenedor.innerHTML = `<div class="col-12 text-center"><p class="text-muted">No hay registros de pago.</p></div>`;
                return;
            }

            misSolicitudes.reverse().forEach((solicitud, indexGlobal) => {
                // Encontrar el índice real en el array general para poder actualizarlo luego
                const indiceReal = todasLasSolicitudes.findIndex(s => s.idSolicitud === solicitud.idSolicitud);

                let contenidoPago = '';

                if (solicitud.esPagoTotal) {
                    // SI PAGÓ TODO DE UNA VEZ
                    contenidoPago = `
                        <div class="alert alert-success d-flex align-items-center mb-0" role="alert">
                            <span class="fs-4 me-3">✅</span>
                            <div>
                                <h5 class="alert-heading mb-1 fw-bold">Pago Realizado</h5>
                                <p class="mb-0 small">El servicio de $${solicitud.totalPagado.toLocaleString('es-CL')} fue pagado en su totalidad.</p>
                            </div>
                        </div>
                    `;
                } else {
                    // SI PAGÓ CON PIE Y CUOTAS
                    const cuotasPendientes = solicitud.cuotasTotales - solicitud.cuotasPagadas;
                    
                    if (cuotasPendientes === 0) {
                        contenidoPago = `
                            <div class="alert alert-success d-flex align-items-center mb-0" role="alert">
                                <span class="fs-4 me-3">🎉</span>
                                <div>
                                    <h5 class="alert-heading mb-1 fw-bold">¡Deuda Saldada!</h5>
                                    <p class="mb-0 small">Has pagado las ${solicitud.cuotasTotales} cuotas exitosamente.</p>
                                </div>
                            </div>
                        `;
                    } else {
                        contenidoPago = `
                            <div class="bg-white border rounded p-3">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted">Cuotas pagadas: <strong>${solicitud.cuotasPagadas} / ${solicitud.cuotasTotales}</strong></span>
                                    <span class="color-cian fw-bold">Valor Cuota: $${solicitud.valorCuota.toLocaleString('es-CL')}</span>
                                </div>
                                <div class="progress mb-3" style="height: 10px;">
                                    <div class="progress-bar bg-verde" role="progressbar" style="width: ${(solicitud.cuotasPagadas / solicitud.cuotasTotales) * 100}%"></div>
                                </div>
                                <button class="btn btn-sm btn-verde text-white w-100" onclick="pagarCuota(${indiceReal})">Pagar Próxima Cuota ($${solicitud.valorCuota.toLocaleString('es-CL')})</button>
                            </div>
                        `;
                    }
                }

                contenedor.innerHTML += `
                    <div class="col-md-6 mb-4">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-verde-claro fw-bold color-verde">
                                Solicitud: ${solicitud.idSolicitud} | ${solicitud.tipoPropiedad}
                            </div>
                            <div class="card-body">
                                ${contenidoPago}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Función para simular el pago de una cuota
        function pagarCuota(indiceReal) {
            let todasLasSolicitudes = JSON.parse(localStorage.getItem('solicitudesLimpieza'));
            
            // Sumar 1 a las cuotas pagadas
            todasLasSolicitudes[indiceReal].cuotasPagadas += 1;
            
            // Guardar en la base de datos simulada
            localStorage.setItem('solicitudesLimpieza', JSON.stringify(todasLasSolicitudes));
            
            // Mostrar alerta y recargar la pantalla
            alert('¡Cuota pagada con éxito!');
            cargarPagos(); // Recargar visualmente
        }

        // Cargar los pagos al iniciar la página
        cargarPagos();
    </script>
</body>
</html>
