<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado Corporativo - LimpiezaPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
    <script>
        if (localStorage.getItem('sesionEmpresaActiva') !== 'true') window.location.href = 'index.html';
    </script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg custom-navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="empresa.html">LimpiezaPro - Portal Corporativo</a>
            <div class="ms-auto">
                <a href="empresa.html" class="btn btn-outline-light btn-sm">Volver al Panel</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="mb-4 color-azul-claro fw-bold text-center">Estado de Solicitudes Corporativas</h2>
        <div class="row" id="contenedorEstadosEmpresa">
            <!-- Los estados se cargarán aquí por JS -->
        </div>
    </div>

    <script>
        const empresaActiva = localStorage.getItem('nombreEmpresaActiva');
        const todasLasSolicitudes = JSON.parse(localStorage.getItem('solicitudesLimpieza')) || [];
        
        // Filtramos para que solo vea las de esta empresa
        const misSolicitudes = todasLasSolicitudes.filter(sol => sol.usuario === empresaActiva && sol.tipoCliente === 'Empresa');
        const contenedor = document.getElementById('contenedorEstadosEmpresa');

        if (misSolicitudes.length === 0) {
            contenedor.innerHTML = `<div class="col-12 text-center"><p class="text-muted">No existen servicios corporativos en curso.</p></div>`;
        } else {
            misSolicitudes.reverse().forEach(solicitud => {
                let colorEstado = 'bg-warning text-dark'; 
                if(solicitud.estado === 'En marcha') colorEstado = 'bg-info text-white';
                if(solicitud.estado === 'Terminada') colorEstado = 'bg-success text-white';

                contenedor.innerHTML += `
                    <div class="col-md-6 mb-4">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-azul-muy-claro d-flex justify-content-between align-items-center">
                                <span class="fw-bold color-azul-claro">OT: ${solicitud.idSolicitud}</span>
                                <span class="badge ${colorEstado}">${solicitud.estado}</span>
                            </div>
                            <div class="card-body">
                                <h5 class="card-title fw-bold text-secondary">${solicitud.tipoPropiedad}</h5>
                                <p class="card-text mb-1"><strong>Fecha de emisión:</strong> ${solicitud.fecha}</p>
                                <p class="card-text mb-0"><strong>Monto Total Facturado:</strong> $${solicitud.totalPagado.toLocaleString('es-CL')}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
