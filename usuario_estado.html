<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Servicios - LimpiezaPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
    <script>
        if (localStorage.getItem('sesionActiva') !== 'true') { window.location.href = 'index.html'; }
    </script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg custom-navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="usuario.html">LimpiezaPro - Portal Usuario</a>
            <div class="ms-auto">
                <a href="usuario.html" class="btn btn-outline-light btn-sm">Volver al Panel</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="mb-4 color-azul-claro fw-bold text-center">Estado de tus Solicitudes</h2>
        <div class="row" id="contenedorEstados">
            <!-- Los estados se cargarán aquí por JS -->
        </div>
    </div>

    <script>
        const usuarioActivo = localStorage.getItem('nombreUsuarioActivo');
        const todasLasSolicitudes = JSON.parse(localStorage.getItem('solicitudesLimpieza')) || [];
        // Filtrar solo las de este usuario
        const misSolicitudes = todasLasSolicitudes.filter(sol => sol.usuario === usuarioActivo);
        const contenedor = document.getElementById('contenedorEstados');

        if (misSolicitudes.length === 0) {
            contenedor.innerHTML = `<div class="col-12 text-center"><p class="text-muted">No tienes servicios contratados aún.</p></div>`;
        } else {
            misSolicitudes.reverse().forEach(solicitud => {
                // Definir color según estado
                let colorEstado = 'bg-warning text-dark'; // En proceso de validación
                if(solicitud.estado === 'En marcha') colorEstado = 'bg-info text-white';
                if(solicitud.estado === 'Terminada') colorEstado = 'bg-success text-white';

                contenedor.innerHTML += `
                    <div class="col-md-6 mb-4">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-cian-claro d-flex justify-content-between align-items-center">
                                <span class="fw-bold color-cian">ID: ${solicitud.idSolicitud}</span>
                                <span class="badge ${colorEstado}">${solicitud.estado}</span>
                            </div>
                            <div class="card-body">
                                <h5 class="card-title fw-bold">Servicio: ${solicitud.tipoPropiedad}</h5>
                                <p class="card-text mb-1"><strong>Fecha solicitud:</strong> ${solicitud.fecha}</p>
                                <p class="card-text mb-0"><strong>Monto Total:</strong> $${solicitud.totalPagado.toLocaleString('es-CL')}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
